<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agroforestry inventory</title>
  <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="map"></div>

  <header id="panel">
    <div class="title">
      <strong id="species">—</strong>
      <span id="site" class="sub"></span>
    </div>

    <div class="count">
      <span id="total">—</span>
      <span class="label">plants detected</span>
    </div>

    <div class="controls">
      <label class="row">
        <span>minimum confidence <output id="conf-value">0.25</output></span>
        <input id="conf" type="range" min="0" max="0.95" step="0.05" value="0.25" />
      </label>
      <label class="row">
        <span>orthophoto opacity <output id="opacity-value">100</output>%</span>
        <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />
      </label>
      <div class="buttons">
        <button id="btn-boxes" class="on">boxes</button>
        <button id="btn-centres">centres</button>
        <button id="btn-export">export</button>
      </div>
    </div>

    <details id="card">
      <summary>accuracy of this model</summary>
      <div id="card-body"></div>
    </details>
  </header>

  <div id="notice" hidden></div>

  <script src="./vendor/maplibre-gl.js"></script>
  <script src="./app.js"></script>
</body>
</html>
